[project]
name = "001-tdd-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.12",
    "pydantic-settings>=2.8.1",
    "uvicorn>=0.34.1",
    "asyncpg>=0.30.0",
    "tortoise-orm>=0.25.0",
    "aerich>=0.8.2",
    "httpx2>=0.1.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = [
     "E",       # pycodestyle errors
     "W",       # pycodestyle warnings
     "F",       # pyflakes
     "I",       # isort
     "B",       # flake8-bugbear
     "UP",      # pyupgrade
]
ignore = [
     "B008",    # FastAPI Depends() pattern is intentional
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.aerich]
tortoise_orm = "app.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
