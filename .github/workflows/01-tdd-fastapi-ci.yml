name: Continuous Integration

on:
  push:
    paths:
      - '001-tdd-fastapi/**'
      - '.github/workflows/01-tdd-fastapi/ci.yml'
  pull_request:
    paths:
      - '001-tdd-fastapi/**'
      - '.github/workflows/01-tdd-fastapi/ci.yml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/001-tdd-fastapi
  PROJECT_DIR: 001-tdd-fastapi

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv sync --all-extras

      - name: Run Ruff (lint)
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run ruff check .

      - name: Run Ruff (format)
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv sync --all-extras

      - name: Run tests with coverage
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/web_dev
          DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/web_test
          ENVIRONMENT: ci
          TESTING: "1"
        run: uv run pytest --cov=app --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ${{ env.PROJECT_DIR }}/coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ ${{ github.ref }} == refs/heads/main ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event_name }} == pull_request ]]; then
            echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
